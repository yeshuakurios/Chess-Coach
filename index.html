<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Chess Coach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231B1A17%22/><text x=%2250%22 y=%2270%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22%23B08D4F%22>♞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">♞</span>
      <span class="brand-word">Ledger</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="upload">New Game</button>
      <button class="tab" data-view="review">Review</button>
      <button class="tab" data-view="puzzles">Puzzles</button>
      <button class="tab" data-view="weaknesses">Weaknesses</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>

  <main id="view-root" class="view-root">
    <!-- views render here -->
  </main>

  <div id="toast" class="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/elo.js"></script>
<script src="js/board.js"></script>
<script src="js/api.js"></script>
<script src="js/views.dashboard.js"></script>
<script src="js/views.upload.js"></script>
<script src="js/views.review.js"></script>
<script src="js/views.puzzles.js"></script>
<script src="js/views.weaknesses.js"></script>
<script src="js/views.settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
